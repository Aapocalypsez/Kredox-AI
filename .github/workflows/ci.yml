name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: npm run check --workspace server

      - name: Build frontend
        run: npm run build --workspace client

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  python-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check ML service syntax
        run: python -m py_compile ml/main.py ml/train_model.py
