name: Deploy Kredox AI To AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  API_ECR_REPOSITORY: kredox-ai-api
  ML_ECR_REPOSITORY: kredox-ai-ml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          API_IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ github.sha }}"
          API_LATEST="${{ steps.ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:latest"
          docker build -f server/Dockerfile -t "$API_IMAGE" .
          docker tag "$API_IMAGE" "$API_LATEST"
          docker push "$API_IMAGE"
          docker push "$API_LATEST"

      - name: Build and push ML image
        run: |
          ML_IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ML_ECR_REPOSITORY }}:${{ github.sha }}"
          ML_LATEST="${{ steps.ecr.outputs.registry }}/${{ env.ML_ECR_REPOSITORY }}:latest"
          docker build -f ml/Dockerfile -t "$ML_IMAGE" .
          docker tag "$ML_IMAGE" "$ML_LATEST"
          docker push "$ML_IMAGE"
          docker push "$ML_LATEST"

      - name: Deploy API ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --service "${{ secrets.API_ECS_SERVICE_NAME }}" \
            --force-new-deployment

      - name: Deploy ML ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --service "${{ secrets.ML_ECS_SERVICE_NAME }}" \
            --force-new-deployment

      - name: Build frontend
        run: |
          npm ci
          npm run build --workspace client

      - name: Sync frontend to S3
        run: |
          aws s3 sync client/dist "s3://${{ secrets.FRONTEND_BUCKET_NAME }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
