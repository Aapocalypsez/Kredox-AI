services:
  - type: web
    name: kredox-ai-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CV_ANALYSIS_ENABLED
        value: "false"
      - key: CV_PROVIDER
        value: demo
      - key: AZURE_FACE_ENDPOINT
        sync: false
      - key: AZURE_FACE_API_KEY
        sync: false
      - key: AZURE_FACE_API_VERSION
        value: v1.0
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: REDIS_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: ML_SERVICE_URL
        sync: false

  - type: web
    name: kredox-ai-ml
    runtime: python
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
