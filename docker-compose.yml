services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kredox_ai
      POSTGRES_USER: kredox
      POSTGRES_PASSWORD: kredox_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kredox -d kredox_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://kredox:kredox_password@postgres:5432/kredox_ai
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8001
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      CLIENT_ORIGIN: http://localhost:5173
      DOMAIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ml/risk_model.pkl:/app/risk_model.pkl:ro

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
